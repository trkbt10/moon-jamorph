<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Micado dic.bin Demo</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --fg: #132238;
        --muted: #526377;
        --panel: #ffffff;
        --border: #d7dee7;
        --accent: #0057d8;
      }
      body {
        margin: 0;
        background: radial-gradient(circle at 20% 0%, #ffffff 0%, var(--bg) 55%);
        color: var(--fg);
        font-family: "IBM Plex Sans", "Noto Sans JP", sans-serif;
      }
      .wrap {
        max-width: 900px;
        margin: 24px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
      }
      textarea {
        width: 100%;
        min-height: 110px;
        border-radius: 10px;
        border: 1px solid var(--border);
        padding: 10px;
        font: inherit;
        box-sizing: border-box;
      }
      .row {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      button {
        border: 0;
        background: var(--accent);
        color: white;
        padding: 9px 14px;
        border-radius: 10px;
        cursor: pointer;
        font: inherit;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 14px;
        font-size: 14px;
      }
      th,
      td {
        border-bottom: 1px solid var(--border);
        text-align: left;
        padding: 8px 6px;
      }
      th {
        color: var(--muted);
      }
      #status {
        color: var(--muted);
        font-size: 13px;
      }
      @media (max-width: 640px) {
        h1 {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Micado dic.bin Demo</h1>
      <p>Single-file dictionary (`.dic.bin`) tokenizer running directly in browser.</p>
      <div class="panel">
        <textarea id="input">東京大学で自然言語処理を学ぶ</textarea>
        <div class="row">
          <button id="analyze">Analyze</button>
          <span id="status">Loading dic.bin...</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>surface</th>
              <th>pos_detail</th>
              <th>start</th>
              <th>end</th>
            </tr>
          </thead>
          <tbody id="result"></tbody>
        </table>
      </div>
    </div>
    <script type="module" src="./demo.mjs"></script>
  </body>
</html>
