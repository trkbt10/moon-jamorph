<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>micado Demo</title>
    <style>
      :root {
        --bg: #f5f5f2;
        --bg-soft: #fbfbf9;
        --text: #111318;
        --muted: #6a707c;
        --line: #d8dce3;
        --panel: #ffffff;
        --panel-shadow: 0 10px 30px rgba(14, 20, 33, 0.06);
        --accent: #0f1115;
        --accent-contrast: #f7f8fb;
      }
      body {
        margin: 0;
        background:
          radial-gradient(1000px 500px at 10% -5%, #ffffff 0%, transparent 60%),
          linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 100%);
        color: var(--text);
        font-family: "IBM Plex Sans", "Noto Sans JP", sans-serif;
      }
      .shell {
        max-width: 1040px;
        margin: 0 auto;
        padding: 36px 18px 28px;
      }
      .hero {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 22px;
      }
      h1 {
        font-size: clamp(28px, 4vw, 40px);
        line-height: 1.08;
        margin: 0 0 10px;
      }
      .eyebrow {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }
      .lead {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
      }
      .hero-links {
        display: flex;
        gap: 8px;
        flex-wrap: nowrap;
        justify-content: flex-end;
      }
      .icon-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--text);
        border-radius: 10px;
        text-decoration: none;
        transition: transform 0.18s ease, border-color 0.18s ease;
      }
      .icon-link svg {
        width: 19px;
        height: 19px;
        display: block;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(320px, 1fr);
        gap: 14px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--panel-shadow);
        padding: 16px;
        animation: rise-in 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .panel.tokens {
        animation-delay: 0.08s;
      }
      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .panel h2 {
        margin: 0;
        font-size: 15px;
        letter-spacing: 0.02em;
      }
      .caption {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .status {
        color: var(--muted);
        font-size: 12px;
        font-family: "IBM Plex Mono", "Noto Sans Mono", monospace;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 10px;
        white-space: nowrap;
      }
      .field + .field {
        margin-top: 12px;
      }
      label {
        display: inline-block;
        margin-bottom: 6px;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      textarea,
      select {
        width: 100%;
        border-radius: 10px;
        border: 1px solid var(--line);
        padding: 10px 11px;
        font: inherit;
        box-sizing: border-box;
        background: #fff;
        color: var(--text);
      }
      textarea {
        min-height: 118px;
        resize: vertical;
      }
      .controls {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: end;
      }
      .controls .field {
        flex: 1 1 220px;
        margin: 0;
      }
      button {
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--accent-contrast);
        padding: 10px 16px;
        border-radius: 10px;
        cursor: pointer;
        font: inherit;
        min-height: 41px;
      }
      .table-wrap {
        overflow: auto;
        max-height: 56vh;
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        text-align: left;
        padding: 10px 10px;
      }
      td {
        font-family: "IBM Plex Mono", "Noto Sans Mono", monospace;
        font-size: 12px;
      }
      th {
        color: var(--muted);
        background: #fafbfc;
        position: sticky;
        top: 0;
      }
      tbody tr:hover {
        background: #f8fafc;
      }
      .table-wrap tr:last-child td {
        border-bottom: none;
      }
      .footer {
        margin-top: 14px;
        color: var(--muted);
        font-size: 12px;
      }
      @media (hover: hover) {
        .icon-link:hover {
          transform: translateY(-1px);
          border-color: #c7ccd5;
        }
      }
      @media (max-width: 740px) {
        .shell {
          padding-top: 24px;
        }
        .hero {
          flex-direction: column;
        }
        .hero-links {
          justify-content: flex-start;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .panel {
          animation: none;
        }
        .icon-link {
          transition: none;
        }
      }
      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">micado</p>
          <h1>Japanese Morphological Tokenizer</h1>
          <p class="lead">辞書プロファイルを切り替えて解析結果を比較できます。</p>
        </div>
        <div class="hero-links">
          <a
            class="icon-link"
            href="https://github.com/trkbt10/moon-jamorph"
            target="_blank"
            rel="noreferrer"
            aria-label="GitHub repository"
            title="GitHub repository"
            ><svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                fill="currentColor"
                d="M8 0C3.58 0 0 3.67 0 8.2c0 3.63 2.29 6.71 5.47 7.8.4.08.55-.18.55-.4 0-.2-.01-.86-.01-1.56-2.01.38-2.53-.5-2.69-.96-.09-.24-.48-.96-.82-1.15-.28-.16-.68-.56-.01-.57.63-.01 1.08.59 1.23.84.72 1.24 1.87.89 2.33.68.07-.53.28-.89.5-1.09-1.78-.21-3.64-.92-3.64-4.08 0-.9.31-1.64.82-2.22-.08-.21-.36-1.04.08-2.17 0 0 .67-.22 2.2.85a7.36 7.36 0 0 1 4 0c1.53-1.07 2.2-.85 2.2-.85.44 1.13.16 1.96.08 2.17.51.58.82 1.32.82 2.22 0 3.17-1.87 3.87-3.65 4.08.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.19 0 .22.15.49.55.4A8.24 8.24 0 0 0 16 8.2C16 3.67 12.42 0 8 0Z"
              />
            </svg></a
          >
        </div>
      </header>

      <div class="layout">
        <section class="panel controls-panel">
          <div class="panel-head">
            <h2>Input</h2>
            <div id="status" class="status">Loading...</div>
          </div>
          <div class="field">
            <label for="example">Example</label>
            <select id="example"></select>
          </div>
          <div class="field">
            <label for="input">Text</label>
            <textarea id="input"></textarea>
          </div>
          <div class="controls">
            <div class="field">
              <label for="profile">Dictionary Profile</label>
              <select id="profile"></select>
            </div>
            <button id="analyze">Analyze</button>
          </div>
        </section>

        <section class="panel tokens">
          <div class="panel-head">
            <h2>Tokens</h2>
            <p class="caption">surface / pos_detail / start / end</p>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>surface</th>
                  <th>pos_detail</th>
                  <th>start</th>
                  <th>end</th>
                </tr>
              </thead>
              <tbody id="result"></tbody>
            </table>
          </div>
        </section>
      </div>
      <p class="footer">Powered by MoonBit + .dic.bin runtime loader</p>
    </main>
    <script type="module" src="./demo/browser-demo.ts"></script>
  </body>
</html>
