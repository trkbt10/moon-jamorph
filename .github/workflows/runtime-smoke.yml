name: Runtime Smoke (CLI + Wasm)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOONBIT_VERSION: "latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all

      - name: Install MeCab dictionary runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y mecab mecab-ipadic mecab-ipadic-utf8
          mecab -v
          if command -v mecab-config >/dev/null 2>&1; then
            mecab-config --dicdir
          else
            mecab -D | sed -n 's/^dicdir: //p'
          fi

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: Build Streaming Package
        run: |
          npm --prefix packages/micado-streaming ci
          npm --prefix packages/micado-streaming run build

      - name: Runtime verification
        run: |
          tools/distribution/check_no_tmp_moonpkg.sh
          tools/distribution/check_dict_abolished.sh
          tools/distribution/verify_cli_wasm.sh
