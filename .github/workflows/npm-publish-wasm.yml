name: Publish WASM to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip actual publish)"
        required: false
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-wasm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOONBIT_VERSION: "latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all

      - name: Update MoonBit dependencies
        run: moon update

      - name: Build WASM and dictionaries
        run: tools/distribution/build_wasm_npm.sh

      - name: Build Streaming Package
        working-directory: packages/micado-streaming
        run: |
          npm ci
          npm run build

      - name: Build TypeScript
        working-directory: npm/micado-wasm
        run: |
          npm ci
          npm run build

      - name: Sync version from moon.mod.json
        run: tools/distribution/sync_versions.sh

      - name: Verify version matches tag
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          MOD_VERSION="$(jq -r .version moon.mod.json)"
          if [[ "$TAG_VERSION" != "$MOD_VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) does not match moon.mod.json version ($MOD_VERSION)"
            exit 1
          fi
          echo "Version verified: $MOD_VERSION"

      - name: Publish to npm (dry run)
        if: inputs.dry_run == true
        working-directory: npm/micado-wasm
        run: npm publish --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: inputs.dry_run != true
        working-directory: npm/micado-wasm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
