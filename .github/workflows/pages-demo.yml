name: Deploy Demo To Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages-demo.yml"
      - "moon.mod.json"
      - "cmd/wasm_api/**"
      - "src/**"
      - "npm/micado-wasm/**"
      - "tools/distribution/build_wasm_npm.sh"
      - "tools/dict-compiler/scripts/build_web_dic_artifacts.mjs"
      - "tools/dict-compiler/scripts/web_dic_build_core.mjs"
      - "tools/dict-compiler/scripts/build_web_dic_bin.mjs"
      - "tools/dict-compiler/scripts/build_web_small_tsv.sh"
      - "tools/dict-compiler/scripts/compress_dic_bin_deflate.mjs"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      MOONBIT_VERSION: "latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all

      - name: Build Web Wasm Artifacts
        run: |
          moon update
          tools/distribution/build_wasm_npm.sh

      - name: Install Demo Dependencies
        run: |
          npm --prefix npm/micado-wasm ci

      - name: Prepare site directory
        run: |
          rm -rf _site
          (
            cd npm/micado-wasm
            npx vite build --base ./ --outDir ../../_site --emptyOutDir
          )
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
