name: Deploy Demo To Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages-demo.yml"
      - "npm/micado-wasm/**"
      - "tools/distribution/build_wasm_npm.sh"
      - "tools/dict-compiler/scripts/build_web_dic_bin.mjs"
      - "tools/dict-compiler/scripts/build_web_small_tsv.sh"
      - "tools/dict-compiler/scripts/compress_dic_bin_deflate.mjs"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R npm/micado-wasm/* _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>moon-jamorph</title>
              <style>
                :root {
                  --bg: #f5f5f2;
                  --bg-soft: #fbfbf9;
                  --text: #111318;
                  --muted: #6a707c;
                  --line: #d8dce3;
                  --panel: #ffffff;
                  --panel-shadow: 0 14px 34px rgba(14, 20, 33, 0.08);
                  --accent: #0f1115;
                  --accent-contrast: #f7f8fb;
                }
                body {
                  margin: 0;
                  min-height: 100vh;
                  display: grid;
                  place-items: center;
                  background:
                    radial-gradient(1000px 520px at 10% -10%, #ffffff 0%, transparent 62%),
                    linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 100%);
                  color: var(--text);
                  font-family: "IBM Plex Sans", "Noto Sans JP", sans-serif;
                }
                .card {
                  width: min(640px, calc(100vw - 32px));
                  border-radius: 16px;
                  border: 1px solid var(--line);
                  background: var(--panel);
                  box-shadow: var(--panel-shadow);
                  padding: 26px;
                  animation: rise-in 0.48s cubic-bezier(0.2, 0.7, 0.2, 1) both;
                }
                h1 {
                  margin: 0 0 8px;
                  font-size: clamp(28px, 5vw, 40px);
                }
                p {
                  margin: 0 0 18px;
                  color: var(--muted);
                }
                .actions {
                  display: flex;
                  flex-wrap: wrap;
                  gap: 12px;
                  align-items: center;
                }
                a.button {
                  text-decoration: none;
                  border-radius: 10px;
                  padding: 10px 16px;
                  border: 1px solid var(--line);
                  color: var(--text);
                  background: #fff;
                  font-weight: 600;
                  transition: transform 0.18s ease, border-color 0.18s ease;
                }
                a.button.primary {
                  background: var(--accent);
                  color: var(--accent-contrast);
                  border-color: var(--accent);
                }
                a.icon-button {
                  width: 40px;
                  height: 40px;
                  padding: 0;
                  display: inline-flex;
                  align-items: center;
                  justify-content: center;
                }
                a.icon-button svg {
                  width: 19px;
                  height: 19px;
                  display: block;
                }
                @media (hover: hover) {
                  a.button:hover {
                    transform: translateY(-1px);
                    border-color: #c7ccd5;
                  }
                }
                @media (prefers-reduced-motion: reduce) {
                  .card,
                  a.button {
                    animation: none;
                    transition: none;
                  }
                }
                @keyframes rise-in {
                  from {
                    opacity: 0;
                    transform: translateY(8px);
                  }
                  to {
                    opacity: 1;
                    transform: translateY(0);
                  }
                }
              </style>
            </head>
            <body>
              <main class="card">
                <h1>moon-jamorph</h1>
                <p>MoonBit 製の日本語形態素解析デモです。</p>
                <div class="actions">
                  <a class="button primary" href="./demo/">デモを開く</a>
                  <a class="button icon-button" href="https://github.com/trkbt10/moon-jamorph" target="_blank" rel="noreferrer" aria-label="GitHub repository" title="GitHub repository">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                      <path fill="currentColor" d="M8 0C3.58 0 0 3.67 0 8.2c0 3.63 2.29 6.71 5.47 7.8.4.08.55-.18.55-.4 0-.2-.01-.86-.01-1.56-2.01.38-2.53-.5-2.69-.96-.09-.24-.48-.96-.82-1.15-.28-.16-.68-.56-.01-.57.63-.01 1.08.59 1.23.84.72 1.24 1.87.89 2.33.68.07-.53.28-.89.5-1.09-1.78-.21-3.64-.92-3.64-4.08 0-.9.31-1.64.82-2.22-.08-.21-.36-1.04.08-2.17 0 0 .67-.22 2.2.85a7.36 7.36 0 0 1 4 0c1.53-1.07 2.2-.85 2.2-.85.44 1.13.16 1.96.08 2.17.51.58.82 1.32.82 2.22 0 3.17-1.87 3.87-3.65 4.08.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.19 0 .22.15.49.55.4A8.24 8.24 0 0 0 16 8.2C16 3.67 12.42 0 8 0Z" />
                    </svg>
                  </a>
                </div>
              </main>
            </body>
          </html>
          HTML
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
