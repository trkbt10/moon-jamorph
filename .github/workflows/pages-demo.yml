name: Deploy Demo To Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages-demo.yml"
      - "npm/micado-wasm/**"
      - "tools/distribution/build_wasm_npm.sh"
      - "tools/dict-compiler/scripts/build_web_dic_bin.mjs"
      - "tools/dict-compiler/scripts/build_web_small_tsv.sh"
      - "tools/dict-compiler/scripts/compress_dic_bin_deflate.mjs"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R npm/micado-wasm/* _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=./demo/" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Micado Demo</title>
            </head>
            <body>
              <p>Redirecting to <a href="./demo/">demo</a>...</p>
            </body>
          </html>
          HTML
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
