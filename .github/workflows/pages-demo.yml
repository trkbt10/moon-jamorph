name: Deploy Demo To Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages-demo.yml"
      - "npm/micado-wasm/**"
      - "tools/distribution/build_wasm_npm.sh"
      - "tools/dict-compiler/scripts/build_web_dic_bin.mjs"
      - "tools/dict-compiler/scripts/build_web_small_tsv.sh"
      - "tools/dict-compiler/scripts/compress_dic_bin_deflate.mjs"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          rm -rf _site
          mkdir -p _site
          cp npm/micado-wasm/index.html _site/
          cp npm/micado-wasm/index.mjs _site/
          cp npm/micado-wasm/demo.mjs _site/
          cp npm/micado-wasm/examples.mjs _site/
          cp npm/micado-wasm/dic-bin.mjs _site/
          cp -R npm/micado-wasm/dist _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
